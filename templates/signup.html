<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create account | ATHARVADRISHTI</title><link rel="stylesheet" href="/static/product.css"></head><body><div class="auth-page"><div class="auth-card"><div class="auth-head"><a class="brand" href="/landing"><span class="brand-mark">🌿</span>ATHARVADRISHTI</a><h1>Create your account</h1><p>Secure your plant-health history with verified email, verified mobile and optional two-factor authentication.</p></div><div id="msg"></div><form id="signup"><div class="field"><label>Full name</label><input id="name" required maxlength="120" placeholder="Your name"></div><div class="field"><label>Email address</label><input id="email" type="email" required placeholder="you@example.com"></div><div class="field"><label>Mobile number</label><input id="phone" required placeholder="+919876543210" autocomplete="tel"></div><div class="field"><label>Password</label><input id="password" type="password" minlength="8" required placeholder="At least 8 characters"></div><div class="auth-actions"><button class="btn btn-primary" type="submit">Create account</button><a class="btn btn-soft" href="/login">I already have an account</a></div></form><p class="top-note">After signup, you will verify both contact channels.</p></div></div><script>const $=id=>document.getElementById(id);$('signup').addEventListener('submit',async e=>{e.preventDefault();$('msg').innerHTML='';try{const r=await fetch('/api/product-auth/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:$('name').value,email:$('email').value,phone:$('phone').value,password:$('password').value})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Unable to create account');localStorage.setItem('verifyEmail',d.email);localStorage.setItem('verifyPhone',d.phone);$('msg').innerHTML='<div class="notice">Account created. Verification codes were sent to your email and mobile number.</div>';setTimeout(()=>location.href='/verify',500)}catch(err){$('msg').innerHTML='<div class="error">'+err.message+'</div>'}})</script></body></html>
