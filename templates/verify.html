<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verify account | ATHARVADRISHTI</title><link rel="stylesheet" href="/static/product.css"></head><body><div class="auth-page"><div class="auth-card"><div class="auth-head"><a class="brand" href="/landing"><span class="brand-mark">🌿</span>ATHARVADRISHTI</a><h1>Verify your account</h1><p>Enter the codes sent to your email and mobile number.</p></div><div id="msg"></div><div class="otp-grid"><div><div class="field"><label>Email verification code</label><input class="code-input" id="emailCode" inputmode="numeric" maxlength="6" placeholder="000000"></div><button class="btn btn-primary" id="verifyEmail">Verify email</button></div><div><div class="field"><label>Mobile verification code</label><input class="code-input" id="mobileCode" inputmode="numeric" maxlength="6" placeholder="000000"></div><button class="btn btn-primary" id="verifyMobile">Verify mobile</button></div></div><div class="auth-actions"><button class="btn btn-soft" id="resend">Resend codes</button><a class="btn btn-soft" href="/login">Back to login</a></div><p class="top-note">Codes expire after 10 minutes.</p></div></div><script>const $=id=>document.getElementById(id);const email=localStorage.getItem('verifyEmail')||'';const phone=localStorage.getItem('verifyPhone')||'';function show(t,ok=false){$('msg').innerHTML='<div class="'+(ok?'notice':'error')+'">'+t+'</div>'}async function post(url,body){const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json();if(!r.ok)throw new Error(d.error||'Request failed');return d}$('verifyEmail').onclick=async()=>{try{await post('/api/product-auth/verify-email',{email,code:$('emailCode').value});localStorage.setItem('emailVerified','1');show('Email verified successfully.',true)}catch(e){show(e.message)}};$('verifyMobile').onclick=async()=>{try{await post('/api/product-auth/verify-mobile',{phone,code:$('mobileCode').value});localStorage.setItem('mobileVerified','1');show('Mobile number verified successfully.',true)}catch(e){show(e.message)}};$('resend').onclick=async()=>{try{await post('/api/product-auth/resend',{email});show('New verification codes have been processed.',true)}catch(e){show(e.message)}};</script></body></html>
