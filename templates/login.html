<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Log in | ATHARVADRISHTI</title><link rel="stylesheet" href="/static/product.css"></head><body><div class="auth-page"><div class="auth-card"><div class="auth-head"><a class="brand" href="/landing"><span class="brand-mark">🌿</span>ATHARVADRISHTI</a><h1>Welcome back</h1><p>Log in securely to continue your plant-health workflow.</p></div><div id="msg"></div><form id="login"><div class="field"><label>Email address</label><input id="email" type="email" required autocomplete="email"></div><div class="field"><label>Password</label><input id="password" type="password" required autocomplete="current-password"></div><div class="auth-actions"><button class="btn btn-primary" type="submit">Log in</button><a class="btn btn-soft" href="/signup">Create account</a></div></form><p class="top-note">New here? Your account must verify email and mobile before login.</p></div></div><script>const $=id=>document.getElementById(id);$('login').addEventListener('submit',async e=>{e.preventDefault();$('msg').innerHTML='';try{const email=$('email').value;const r=await fetch('/api/product-auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password:$('password').value})});const d=await r.json();if(!r.ok)throw new Error(d.verification_required?'Please complete verification first.':(d.error||'Login failed'));if(d.two_factor_required){localStorage.setItem('loginEmail',email);localStorage.setItem('login2faChannel',d.channel);location.href='/two-factor?mode=login';return}localStorage.setItem('accessToken',d.access_token);location.href='/';}catch(err){$('msg').innerHTML='<div class="error">'+err.message+'</div>'}})</script></body></html>
