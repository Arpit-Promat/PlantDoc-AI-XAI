<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Two-factor authentication | ATHARVADRISHTI</title><link rel="stylesheet" href="/static/product.css"></head><body><div class="auth-page"><div class="auth-card"><div class="auth-head"><a class="brand" href="/landing"><span class="brand-mark">🌿</span>ATHARVADRISHTI</a><h1 id="title">Two-factor authentication</h1><p id="desc">Add an extra verification step to protect your account.</p></div><div id="msg"></div><section id="login2fa"><div class="field"><label>6-digit security code</label><input class="code-input" id="loginCode" inputmode="numeric" maxlength="6" placeholder="000000"></div><button class="btn btn-primary" id="verifyLogin">Verify & continue</button></section><section id="setup" style="display:none"><div class="field"><label>2FA delivery channel</label><select id="channel"><option value="email">Email</option><option value="sms">SMS</option></select></div><button class="btn btn-soft" id="sendSetup">Send setup code</button><div class="field" style="margin-top:18px"><label>Setup code</label><input class="code-input" id="setupCode" inputmode="numeric" maxlength="6" placeholder="000000"></div><button class="btn btn-primary" id="enable">Enable 2FA</button></section><p class="top-note"><a href="/landing">Back to ATHARVADRISHTI</a></p></div></div><script>const $=id=>document.getElementById(id);const params=new URLSearchParams(location.search);const loginMode=params.get('mode')==='login';function show(t,ok=false){$('msg').innerHTML='<div class="'+(ok?'notice':'error')+'">'+t+'</div>'}if(loginMode){$('setup').style.display='none';$('login2fa').style.display='block';$('title').textContent='Confirm it’s you';$('desc').textContent='Enter the security code sent to your verified '+(localStorage.getItem('login2faChannel')==='sms'?'mobile number':'email')+'.'}else{$('login2fa').style.display='none';$('setup').style.display='block';$('title').textContent='Protect your account';$('desc').textContent='Choose where your one-time security code should be delivered, then verify it to enable 2FA.'}$('verifyLogin').onclick=async()=>{try{const r=await fetch('/api/product-auth/2fa/verify',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:localStorage.getItem('loginEmail'),code:$('loginCode').value})});const d=await r.json();if(!r.ok)throw new Error(d.error);localStorage.setItem('accessToken',d.access_token);location.href='/';}catch(e){show(e.message)}};$('sendSetup').onclick=async()=>{try{const token=localStorage.getItem('accessToken');const r=await fetch('/api/product-auth/2fa/setup',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify({channel:$('channel').value})});const d=await r.json();if(!r.ok)throw new Error(d.error);show('Setup code sent by '+d.channel+'.',true)}catch(e){show(e.message)}};$('enable').onclick=async()=>{try{const token=localStorage.getItem('accessToken');const r=await fetch('/api/product-auth/2fa/enable',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify({code:$('setupCode').value})});const d=await r.json();if(!r.ok)throw new Error(d.error);show('Two-factor authentication is now enabled.',true)}catch(e){show(e.message)}}</script></body></html>
