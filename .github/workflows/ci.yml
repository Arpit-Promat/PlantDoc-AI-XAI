name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  prediction-engine-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lightweight test dependencies
        run: python -m pip install --upgrade pip numpy pillow

      - name: Run prediction and evaluation tests
        run: python -m unittest discover -s tests -v
